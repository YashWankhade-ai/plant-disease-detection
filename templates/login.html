{% extends 'base.html' %}

{% block title %}Sign In — PlantCare AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="bi bi-person-lock"></i>
      </div>
      <h3 class="fw-bold text-success-emphasis">Welcome Back</h3>
      <p class="text-muted small">Sign in to access your crop diagnosis history and recommendations</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="username_or_email" class="form-label fw-semibold small">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
          <input type="text" class="form-control border-start-0" id="username_or_email" name="username_or_email" placeholder="Enter username or email" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-plant-primary w-100 py-2 mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>

      <div class="text-center">
        <span class="text-muted small">Don't have an account yet? </span>
        <a href="{{ url_for('register') }}" class="text-success fw-bold small text-decoration-none">Create Account</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
